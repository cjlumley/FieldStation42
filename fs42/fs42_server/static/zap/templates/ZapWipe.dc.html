<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZAP! wipe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 640px; height: 480px; overflow: hidden; pointer-events: none">
<div style="position: absolute; left: 0; top: 0; width: 280px; height: 480px; animation: sweepCycle {{dur}}s linear both infinite">
<div style="position: absolute; left: 0; top: -10px; width: 280px; height: 500px; display: flex; transform: skewX(-18.4deg)">
<div style="flex: none; width: 70px"></div>
<div style="flex: none; width: 120px; background: #111111; box-shadow: 0 0 0 3px #111111"></div>
<div style="flex: none; width: 10px"></div>
<div style="flex: none; width: 40px; background: #B6FF00"></div>
<div style="flex: none; width: 10px"></div>
<div style="flex: none; width: 24px; background: #FF7A00"></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dur": {"editor": "number", "default": 7}, "$preview": {"width": 640, "height": 480}}'>
class Component extends DCLogic {
renderVals() {
return { dur: Number(this.props.dur ?? 7) };
}
}
</script>
</body>
</html>
