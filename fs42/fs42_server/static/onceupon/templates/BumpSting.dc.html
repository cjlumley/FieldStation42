<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Once Upon sting</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pacifico&display=swap">
<style>
body{margin:0}
@keyframes pageTurnCycle{0%{transform:scaleX(0.04) skewY(10deg);opacity:0}2%{opacity:1}8%{transform:scaleX(1.02) skewY(-1deg)}10%,88%{transform:scaleX(1) skewY(0deg);opacity:1}97%{transform:scaleX(0.04) skewY(-10deg);opacity:1}100%{transform:scaleX(0.04) skewY(-10deg);opacity:0}}
@keyframes pageShadeCycle{0%{opacity:0.95}9%,88%{opacity:0}97%,100%{opacity:0.95}}
@keyframes stingShootCycle{0%,9.4%{transform:translateX(-260px);opacity:0}10.6%{opacity:1}18%{transform:translateX(330px);opacity:1}20.3%,100%{transform:translateX(330px);opacity:0}}
@keyframes stingPopCycle{0%,16.9%{transform:scale(0.3);opacity:0}20.9%{transform:scale(1.08);opacity:1}23.1%,100%{transform:scale(1);opacity:1}}
@keyframes stingRingCycle{0%,18%{transform:scale(0);opacity:0}21.4%{opacity:1}34%,100%{transform:scale(1.35);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(0.55) rotate(0deg);opacity:0.35}50%{transform:scale(1) rotate(20deg);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bubble{0%{transform:translateY(0);opacity:0}15%{opacity:0.85}100%{transform:translateY(-360px);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
</style>
</helmet>
<div style="width: 640px; height: 480px; position: relative; overflow: hidden; background: #1A0B30; filter: {{crtFilter}}; font-family: 'Fredoka', system-ui, sans-serif; color: #3A1A5C">
<div style="position: absolute; left: 0; top: 0; width: 640px; height: 480px; overflow: hidden; transform-origin: 0% 50%; animation: pageTurnCycle 7s cubic-bezier(0.45, 0, 0.25, 1) both infinite">
<div style="position: absolute; left: 0; top: 0"><dc-import name="OnceBG" theme="{{theme}}" hint-size="640px,480px"></dc-import></div>
<div aria-hidden="true" style="position: absolute; left: 20px; top: 70px; width: 1px; height: 1px; transform: rotate(28deg)">
<div style="position: absolute; left: 0; top: 0; animation: stingShootCycle 7s cubic-bezier(0.3, 0, 0.3, 1) both infinite">
<div style="position: absolute; left: -190px; top: -4px; width: 190px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(255,211,77,0) 0%, rgba(255,211,77,0.9) 100%)"></div>
<div style="position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; background: #FFFFFF; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%)"></div>
</div>
</div>
<div aria-hidden="true" style="position: absolute; left: 320px; top: 240px; width: 1px; height: 1px; animation: stingRingCycle 7s ease-out both infinite">
<div style="position: absolute; left: 158px; top: -12px; width: 24px; height: 24px; background: #FFD34D; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%)"></div>
<div style="position: absolute; left: 108px; top: 108px; width: 24px; height: 24px; background: #FFFFFF; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%)"></div>
<div style="position: absolute; left: -12px; top: 158px; width: 24px; height: 24px; background: #7FE8D0; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%)"></div>
<div style="position: absolute; left: -132px; top: 108px; width: 24px; height: 24px; background: #FFFFFF; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%)"></div>
<div style="position: absolute; left: -182px; top: -12px; width: 24px; height: 24px; background: #FFD34D; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%)"></div>
<div style="position: absolute; left: -132px; top: -132px; width: 24px; height: 24px; background: #FFFFFF; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%)"></div>
<div style="position: absolute; left: -12px; top: -182px; width: 24px; height: 24px; background: #B48CFF; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%)"></div>
<div style="position: absolute; left: 108px; top: -132px; width: 24px; height: 24px; background: #FFFFFF; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%)"></div>
</div>
<div style="position: absolute; left: 64px; top: 48px; width: 512px; height: 384px; display: flex; align-items: center; justify-content: center">
<div style="animation: stingPopCycle 7s cubic-bezier(0.2, 0.8, 0.3, 1) both infinite"><div style="animation: bob 2s ease-in-out infinite"><dc-import name="OnceWordmark" size="104" hint-size="520px,187px"></dc-import></div></div>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none"><dc-import name="OncePage" dur="7" hint-size="640px,480px"></dc-import></div>
</div>
<sc-if value="{{crt}}" hint-placeholder-val="{{true}}">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 640px; height: 480px; z-index: 10; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(0,0,0,0.3) 0px, rgba(0,0,0,0.3) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px), repeating-linear-gradient(90deg, rgba(255,0,0,0.06) 0px, rgba(255,0,0,0.06) 1px, rgba(0,255,0,0.06) 1px, rgba(0,255,0,0.06) 2px, rgba(0,0,255,0.06) 2px, rgba(0,0,255,0.06) 3px), radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.5) 100%); box-shadow: inset 0 0 50px rgba(0,0,0,0.55)"></div>
</sc-if>
<sc-if value="{{safe}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; left: 32px; top: 24px; width: 576px; height: 432px; box-sizing: border-box; border: 2px dashed rgba(255,230,0,0.9); z-index: 11; pointer-events: none"></div>
<div aria-hidden="true" style="position: absolute; left: 64px; top: 48px; width: 512px; height: 384px; box-sizing: border-box; border: 2px dashed rgba(0,240,255,0.95); z-index: 11; pointer-events: none"></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["castle", "sparkle", "ocean", "garden", "twilight"], "default": "twilight", "section": "Look"}, "crt": {"editor": "boolean", "default": true, "section": "Look"}, "safe": {"editor": "boolean", "default": false, "section": "Look"}, "$preview": {"width": 640, "height": 480}}'>
class Component extends DCLogic {
renderVals() {
const p = this.props;
const crt = p.crt ?? true;
return { theme: p.theme ?? 'twilight', crt, safe: p.safe ?? false, crtFilter: crt ? 'blur(0.6px) saturate(1.15) contrast(1.06)' : 'none' };
}
}
</script>
</body>
</html>
