<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Once Upon backgrounds</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 640px; height: 480px; position: relative; overflow: hidden; background: {{base}}">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 640px; height: 480px; background: {{wash}}"></div>
<sc-if value="{{isNight}}" hint-placeholder-val="{{true}}">
<sc-for list="{{dots}}" as="s" hint-placeholder-count="18">
<div aria-hidden="true" style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: {{s.sz}}px; height: {{s.sz}}px; border-radius: 50%; background: #FFFFFF; animation: twinkle {{s.dur}}s ease-in-out {{s.d}}s infinite"></div>
</sc-for>
</sc-if>
<sc-if value="{{isCastle}}" hint-placeholder-val="{{true}}">
<div aria-hidden="true" style="position: absolute; left: -100px; top: 392px; width: 560px; height: 200px; border-radius: 50%; background: #3A1A5C"></div>
<div aria-hidden="true" style="position: absolute; left: 330px; top: 380px; width: 420px; height: 200px; border-radius: 50%; background: #2E1350"></div>
<div aria-hidden="true" style="position: absolute; left: 440px; top: 236px; width: 180px; height: 170px">
<div style="position: absolute; left: 4px; top: 62px; width: 34px; height: 108px; background: #2E1350"></div>
<div style="position: absolute; left: -4px; top: 22px; width: 50px; height: 44px; background: #2E1350; clip-path: polygon(50% 0%, 100% 100%, 0% 100%)"></div>
<div style="position: absolute; left: 142px; top: 62px; width: 34px; height: 108px; background: #2E1350"></div>
<div style="position: absolute; left: 134px; top: 22px; width: 50px; height: 44px; background: #2E1350; clip-path: polygon(50% 0%, 100% 100%, 0% 100%)"></div>
<div style="position: absolute; left: 30px; top: 100px; width: 120px; height: 70px; background: #2E1350"></div>
<div style="position: absolute; left: 38px; top: 90px; width: 10px; height: 12px; background: #2E1350"></div>
<div style="position: absolute; left: 52px; top: 90px; width: 10px; height: 12px; background: #2E1350"></div>
<div style="position: absolute; left: 118px; top: 90px; width: 10px; height: 12px; background: #2E1350"></div>
<div style="position: absolute; left: 132px; top: 90px; width: 10px; height: 12px; background: #2E1350"></div>
<div style="position: absolute; left: 64px; top: 28px; width: 52px; height: 142px; background: #2E1350"></div>
<div style="position: absolute; left: 54px; top: -30px; width: 72px; height: 62px; background: #2E1350; clip-path: polygon(50% 0%, 100% 100%, 0% 100%)"></div>
<div style="position: absolute; left: 89px; top: -50px; width: 2px; height: 22px; background: #2E1350"></div>
<div style="position: absolute; left: 91px; top: -50px; width: 22px; height: 14px; background: #FF8FC8; clip-path: polygon(0% 0%, 100% 50%, 0% 100%); animation: sway 3s ease-in-out infinite; transform-origin: 0% 50%"></div>
<div style="position: absolute; left: 20px; top: 4px; width: 2px; height: 20px; background: #2E1350"></div>
<div style="position: absolute; left: 22px; top: 4px; width: 16px; height: 10px; background: #7FE8D0; clip-path: polygon(0% 0%, 100% 50%, 0% 100%)"></div>
<div style="position: absolute; left: 158px; top: 4px; width: 2px; height: 20px; background: #2E1350"></div>
<div style="position: absolute; left: 160px; top: 4px; width: 16px; height: 10px; background: #7FE8D0; clip-path: polygon(0% 0%, 100% 50%, 0% 100%)"></div>
<div style="position: absolute; left: 80px; top: 54px; width: 20px; height: 26px; border-radius: 10px 10px 2px 2px; background: #FFD34D; box-shadow: 0 0 14px rgba(255,211,77,0.85)"></div>
<div style="position: absolute; left: 80px; top: 98px; width: 20px; height: 22px; border-radius: 10px 10px 2px 2px; background: #FFD34D; box-shadow: 0 0 14px rgba(255,211,77,0.85)"></div>
<div style="position: absolute; left: 14px; top: 88px; width: 14px; height: 18px; border-radius: 7px 7px 2px 2px; background: #FFD34D; box-shadow: 0 0 10px rgba(255,211,77,0.8)"></div>
<div style="position: absolute; left: 152px; top: 88px; width: 14px; height: 18px; border-radius: 7px 7px 2px 2px; background: #FFD34D; box-shadow: 0 0 10px rgba(255,211,77,0.8)"></div>
<div style="position: absolute; left: 76px; top: 136px; width: 28px; height: 34px; border-radius: 14px 14px 0 0; background: #1A0A30"></div>
</div>
</sc-if>
<sc-if value="{{isSparkle}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; left: 380px; top: -90px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 65%)"></div>
<div aria-hidden="true" style="position: absolute; left: -160px; top: 60px; width: 960px; height: 70px; background: rgba(255,255,255,0.18); transform: rotate(-16deg)"></div>
<div aria-hidden="true" style="position: absolute; left: -160px; top: 300px; width: 960px; height: 40px; background: rgba(255,255,255,0.14); transform: rotate(-16deg)"></div>
<div aria-hidden="true" style="position: absolute; left: -160px; top: 390px; width: 960px; height: 90px; background: rgba(180,140,255,0.28); transform: rotate(-16deg)"></div>
</sc-if>
<sc-if value="{{isOcean}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; left: 50px; top: -30px; width: 150px; height: 430px; background: linear-gradient(180deg, rgba(255,255,255,0.26) 0%, rgba(255,255,255,0) 100%); clip-path: polygon(38% 0%, 62% 0%, 100% 100%, 0% 100%); transform: rotate(14deg)"></div>
<div aria-hidden="true" style="position: absolute; left: 250px; top: -30px; width: 120px; height: 400px; background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%); clip-path: polygon(38% 0%, 62% 0%, 100% 100%, 0% 100%); transform: rotate(6deg)"></div>
<div aria-hidden="true" style="position: absolute; left: 440px; top: -30px; width: 160px; height: 440px; background: linear-gradient(180deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0) 100%); clip-path: polygon(38% 0%, 62% 0%, 100% 100%, 0% 100%); transform: rotate(-8deg)"></div>
<sc-for list="{{bubbles}}" as="b" hint-placeholder-count="7">
<div aria-hidden="true" style="position: absolute; left: {{b.x}}px; top: {{b.y}}px; width: {{b.s}}px; height: {{b.s}}px; box-sizing: border-box; border-radius: 50%; border: 2px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.14); animation: bubble {{b.dur}}s linear {{b.d}}s infinite"></div>
</sc-for>
<svg aria-hidden="true" viewBox="0 0 640 140" style="position: absolute; left: 0; top: 340px; width: 640px; height: 140px"><path d="M0 40 C80 10 160 70 240 40 C320 10 400 70 480 40 C560 10 600 50 640 36 L640 140 L0 140 Z" style="fill: #1C6E96; opacity: 0.75"></path><path d="M0 80 C90 56 170 104 260 80 C350 56 430 104 520 80 C580 64 620 84 640 78 L640 140 L0 140 Z" style="fill: #0E4466"></path></svg>
</sc-if>
<sc-if value="{{isGarden}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; left: -120px; top: 380px; width: 520px; height: 220px; border-radius: 50%; background: #3E9C77"></div>
<div aria-hidden="true" style="position: absolute; left: 300px; top: 396px; width: 480px; height: 200px; border-radius: 50%; background: #2F8463"></div>
<sc-for list="{{flowers}}" as="f" hint-placeholder-count="6">
<div aria-hidden="true" style="position: absolute; left: {{f.x}}px; top: {{f.y}}px; width: {{f.s}}px; height: {{f.s}}px; animation: sway {{f.dur}}s ease-in-out {{f.d}}s infinite">
<div style="position: absolute; left: {{f.c}}px; top: {{f.c}}px; width: {{f.p}}px; height: {{f.p}}px; margin-left: {{f.m}}px; margin-top: {{f.m}}px; border-radius: 50%; background: {{f.col}}; transform: rotate(0deg) translateY({{f.t}}px)"></div>
<div style="position: absolute; left: {{f.c}}px; top: {{f.c}}px; width: {{f.p}}px; height: {{f.p}}px; margin-left: {{f.m}}px; margin-top: {{f.m}}px; border-radius: 50%; background: {{f.col}}; transform: rotate(72deg) translateY({{f.t}}px)"></div>
<div style="position: absolute; left: {{f.c}}px; top: {{f.c}}px; width: {{f.p}}px; height: {{f.p}}px; margin-left: {{f.m}}px; margin-top: {{f.m}}px; border-radius: 50%; background: {{f.col}}; transform: rotate(144deg) translateY({{f.t}}px)"></div>
<div style="position: absolute; left: {{f.c}}px; top: {{f.c}}px; width: {{f.p}}px; height: {{f.p}}px; margin-left: {{f.m}}px; margin-top: {{f.m}}px; border-radius: 50%; background: {{f.col}}; transform: rotate(216deg) translateY({{f.t}}px)"></div>
<div style="position: absolute; left: {{f.c}}px; top: {{f.c}}px; width: {{f.p}}px; height: {{f.p}}px; margin-left: {{f.m}}px; margin-top: {{f.m}}px; border-radius: 50%; background: {{f.col}}; transform: rotate(288deg) translateY({{f.t}}px)"></div>
<div style="position: absolute; left: {{f.c}}px; top: {{f.c}}px; width: {{f.k}}px; height: {{f.k}}px; margin-left: {{f.km}}px; margin-top: {{f.km}}px; border-radius: 50%; background: #FFD34D"></div>
</div>
</sc-for>
</sc-if>
<sc-if value="{{isTwilight}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; left: 446px; top: 40px; width: 80px; height: 80px; border-radius: 50%; box-shadow: 18px 10px 0 0 #FFE9A8, 18px 10px 34px 8px rgba(255,233,168,0.35)"></div>
<div aria-hidden="true" style="position: absolute; left: -120px; top: 400px; width: 540px; height: 200px; border-radius: 50%; background: #0E0419"></div>
<div aria-hidden="true" style="position: absolute; left: 320px; top: 410px; width: 460px; height: 180px; border-radius: 50%; background: #170A2A"></div>
</sc-if>
<sc-for list="{{marks}}" as="m" hint-placeholder-count="9">
<div aria-hidden="true" style="position: absolute; left: {{m.x}}px; top: {{m.y}}px; width: {{m.sz}}px; height: {{m.sz}}px; animation: twinkle {{m.dur}}s ease-in-out {{m.d}}s infinite">
<div style="width: {{m.sz}}px; height: {{m.sz}}px; background: {{m.c}}; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%)"></div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["castle", "sparkle", "ocean", "garden", "twilight"], "default": "castle"}, "$preview": {"width": 640, "height": 480}}'>
class Component extends DCLogic {
renderVals() {
const theme = this.props.theme ?? 'castle';
const T = {
castle: { base: '#2A1145', wash: 'linear-gradient(180deg, #2A1145 0%, #4B2380 50%, #9C72E8 88%, #C7A8FF 100%)', cols: ['#FFD34D', '#FFFFFF', '#FF8FC8', '#7FE8D0'] },
sparkle: { base: '#E86AAE', wash: 'radial-gradient(ellipse at 50% 45%, #FFC2E2 0%, #FF8FC8 45%, #C2468A 100%)', cols: ['#FFFFFF', '#FFD34D', '#FFFFFF', '#B48CFF'] },
ocean: { base: '#0F4C6E', wash: 'linear-gradient(180deg, #8FF0DA 0%, #2FA8B8 38%, #155F86 72%, #0B3552 100%)', cols: ['#FFFFFF', '#FFD34D', '#FF8FC8', '#FFFFFF'] },
garden: { base: '#4FAF8A', wash: 'radial-gradient(ellipse at 50% 30%, #E4FFF4 0%, #A6EED0 45%, #57B591 100%)', cols: ['#FF8FC8', '#FFFFFF', '#FFD34D', '#B48CFF'] },
twilight: { base: '#1A0B30', wash: 'radial-gradient(ellipse at 70% 20%, #5B3A9E 0%, #2E1858 45%, #140726 100%)', cols: ['#FFD34D', '#FFFFFF', '#B48CFF', '#FF8FC8'] }
};
const t = T[theme] || T.castle;
let s = 7;
const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
const spots = [[36, 36], [128, 96], [548, 48], [596, 176], [24, 236], [84, 392], [520, 300], [596, 420], [300, 22]];
const marks = spots.map((p, i) => ({ x: p[0], y: p[1], sz: Math.round(14 + r() * 22), c: t.cols[i % 4], dur: (2 + r() * 2.2).toFixed(1), d: (-r() * 3).toFixed(1) }));
const dots = Array.from({ length: 18 }, () => ({ x: Math.round(r() * 630), y: Math.round(r() * 280), sz: r() > 0.7 ? 4 : 2, dur: (1.6 + r() * 2).toFixed(1), d: (-r() * 3).toFixed(1) }));
const bubbles = Array.from({ length: 7 }, () => ({ x: Math.round(30 + r() * 570), y: Math.round(300 + r() * 160), s: Math.round(10 + r() * 16), dur: (5 + r() * 4).toFixed(1), d: (-r() * 8).toFixed(1) }));
const F = [[24, 352, 56, '#FF8FC8'], [96, 404, 44, '#FFFFFF'], [506, 362, 60, '#FFB8DC'], [578, 414, 44, '#B48CFF'], [440, 418, 38, '#FFFFFF'], [160, 436, 40, '#B48CFF']];
const flowers = F.map(f => { const sz = f[2]; const p = Math.round(sz * 0.5); const k = Math.round(sz * 0.36); return { x: f[0], y: f[1], s: sz, c: Math.round(sz / 2), p, m: -Math.round(p / 2), t: -Math.round(sz * 0.27), k, km: -Math.round(k / 2), col: f[3], dur: (3 + r() * 2).toFixed(1), d: (-r() * 3).toFixed(1) }; });
return { base: t.base, wash: t.wash, marks, dots, bubbles, flowers, isCastle: theme === 'castle', isSparkle: theme === 'sparkle', isOcean: theme === 'ocean', isGarden: theme === 'garden', isTwilight: theme === 'twilight', isNight: theme === 'castle' || theme === 'twilight' };
}
}
</script>
</body>
</html>
