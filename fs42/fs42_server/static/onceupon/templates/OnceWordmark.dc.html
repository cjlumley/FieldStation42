<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Once Upon logo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Pacifico&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: {{w}}px; height: {{h}}px; display: flex; align-items: center; justify-content: center">
<div role="img" aria-label="Once Upon" style="position: relative; display: flex; flex-direction: column; align-items: center; transform: rotate(-3deg); filter: drop-shadow(0 {{ds}}px {{db}}px rgba(26,11,48,0.45))">
<div style="position: relative">
<span aria-hidden="true" style="display: block; visibility: hidden; font-family: 'Pacifico', cursive; font-size: {{size}}px; line-height: 1.55; white-space: nowrap; padding: 0 0.14em">Once Upon</span>
<svg aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible">
<defs>
<linearGradient id="onceGold" x1="0" y1="0" x2="0" y2="1">
<stop offset="0.18" stop-color="#FFF4BE"></stop>
<stop offset="0.55" stop-color="#FFD34D"></stop>
<stop offset="1" stop-color="#F0A23A"></stop>
</linearGradient>
</defs>
<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" transform="translate(0 {{d}})" style="font-family: 'Pacifico', cursive; font-size: {{size}}px; fill: #3A1A5C; stroke: #3A1A5C; stroke-width: {{sw}}px; stroke-linejoin: round; stroke-linecap: round">Once Upon</text>
<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" style="font-family: 'Pacifico', cursive; font-size: {{size}}px; fill: url(#onceGold); stroke: #3A1A5C; stroke-width: {{sw}}px; stroke-linejoin: round; stroke-linecap: round; paint-order: stroke">Once Upon</text>
</svg>
<div aria-hidden="true" style="position: absolute; right: {{sx}}px; top: {{sy}}px; width: {{ss}}px; height: {{ss}}px; animation: twinkle 2.6s ease-in-out infinite">
<svg viewBox="0 0 100 100" style="display: block; width: 100%; height: 100%; overflow: visible">
<path d="M50 4 C54 36 64 46 96 50 C64 54 54 64 50 96 C46 64 36 54 4 50 C36 46 46 36 50 4 Z" style="fill: #FFFFFF; stroke: #3A1A5C; stroke-width: 9px; stroke-linejoin: round; paint-order: stroke"></path>
<path d="M50 4 C54 36 64 46 96 50 C64 54 54 64 50 96 C46 64 36 54 4 50 C36 46 46 36 50 4 Z" transform="translate(70 66) scale(0.36)" style="fill: #FFD34D; stroke: #3A1A5C; stroke-width: 20px; stroke-linejoin: round; paint-order: stroke"></path>
</svg>
</div>
</div>
<svg aria-hidden="true" viewBox="0 0 300 30" style="display: block; width: 82%; height: auto; aspect-ratio: 10 / 1; margin-top: {{mt}}px; overflow: visible">
<path d="M8 18 C80 2 190 30 292 6 C196 36 84 18 8 18 Z" style="fill: #FF8FC8; stroke: #3A1A5C; stroke-width: 3.5px; stroke-linejoin: round; paint-order: stroke"></path>
</svg>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size": {"editor": "int", "default": 100, "min": 18, "max": 200}, "$preview": {"width": 500, "height": 200}}'>
class Component extends DCLogic {
renderVals() {
const size = Number(this.props.size ?? 100);
return {
size,
w: Math.round(size * 5), h: Math.round(size * 2),
sw: Math.max(1.5, Math.round(size * 0.1 * 10) / 10),
d: Math.max(1, Math.round(size * 0.06)),
ds: Math.max(1, Math.round(size * 0.04)), db: Math.max(1, Math.round(size * 0.07)),
ss: Math.max(10, Math.round(size * 0.46)), sx: -Math.round(size * 0.22), sy: Math.round(size * 0.1),
mt: Math.round(size * 0.02)
};
}
}
</script>
</body>
</html>
