<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Once Upon premiere</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pacifico&display=swap">
<style>
body{margin:0}
@keyframes pageTurnCycle{0%{transform:scaleX(0.04) skewY(10deg);opacity:0}2%{opacity:1}8%{transform:scaleX(1.02) skewY(-1deg)}10%,88%{transform:scaleX(1) skewY(0deg);opacity:1}97%{transform:scaleX(0.04) skewY(-10deg);opacity:1}100%{transform:scaleX(0.04) skewY(-10deg);opacity:0}}
@keyframes pageShadeCycle{0%{opacity:0.95}9%,88%{opacity:0}97%,100%{opacity:0.95}}
@keyframes popCycle{0%,9%{transform:scale(0.4);opacity:0}15%{transform:scale(1.06);opacity:1}18%,100%{transform:scale(1);opacity:1}}
@keyframes riseCycle{0%,11%{transform:translateY(40px);opacity:0}18%,100%{transform:translateY(0);opacity:1}}
@keyframes stampCycle{0%,14%{transform:scale(3) rotate(-20deg);opacity:0}20%{transform:scale(0.92) rotate(-8deg);opacity:1}23%,100%{transform:scale(1) rotate(-8deg);opacity:1}}
@keyframes burstCycle{0%,14%{transform:scale(0) rotate(0deg);opacity:0}20%{transform:scale(1.3) rotate(45deg);opacity:1}28%,100%{transform:scale(1) rotate(90deg);opacity:1}}
@keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{transform:scale(0.55) rotate(0deg);opacity:0.35}50%{transform:scale(1) rotate(20deg);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bubble{0%{transform:translateY(0);opacity:0}15%{opacity:0.85}100%{transform:translateY(-360px);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
</style>
</helmet>
<div style="width: 640px; height: 480px; position: relative; overflow: hidden; background: #1A0B30; filter: {{crtFilter}}; font-family: 'Fredoka', system-ui, sans-serif; color: #3A1A5C">
<div style="position: absolute; left: 0; top: 0; width: 640px; height: 480px; overflow: hidden; transform-origin: 0% 50%; animation: pageTurnCycle 7s cubic-bezier(0.45, 0, 0.25, 1) both infinite">
<div style="position: absolute; left: 0; top: 0"><dc-import name="OnceBG" theme="{{theme}}" hint-size="640px,480px"></dc-import></div>
<div style="position: absolute; left: 64px; top: 48px; width: 512px; height: 344px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
<div style="animation: stampCycle 7s cubic-bezier(0.2, 0.8, 0.3, 1) both infinite"><div style="position: relative; width: 150px; height: 150px">
<div aria-hidden="true" style="position: absolute; left: -6px; top: -6px; width: 162px; height: 162px; animation: spinSlow 18s linear infinite"><div style="width: 162px; height: 162px; background: #3A1A5C; clip-path: polygon(50% 0%, 60.9% 9.4%, 75% 6.7%, 79.7% 20.3%, 93.3% 25%, 90.6% 39.1%, 100% 50%, 90.6% 60.9%, 93.3% 75%, 79.7% 79.7%, 75% 93.3%, 60.9% 90.6%, 50% 100%, 39.1% 90.6%, 25% 93.3%, 20.3% 79.7%, 6.7% 75%, 9.4% 60.9%, 0% 50%, 9.4% 39.1%, 6.7% 25%, 20.3% 20.3%, 25% 6.7%, 39.1% 9.4%)"></div></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 150px; height: 150px; animation: spinSlow 18s linear infinite"><div style="width: 150px; height: 150px; background: #FFD34D; clip-path: polygon(50% 0%, 60.9% 9.4%, 75% 6.7%, 79.7% 20.3%, 93.3% 25%, 90.6% 39.1%, 100% 50%, 90.6% 60.9%, 93.3% 75%, 79.7% 79.7%, 75% 93.3%, 60.9% 90.6%, 50% 100%, 39.1% 90.6%, 25% 93.3%, 20.3% 79.7%, 6.7% 75%, 9.4% 60.9%, 0% 50%, 9.4% 39.1%, 6.7% 25%, 20.3% 20.3%, 25% 6.7%, 39.1% 9.4%)"></div></div>
<div style="position: absolute; left: 22px; top: 22px; width: 106px; height: 106px; box-sizing: border-box; border-radius: 50%; border: 3px dashed #C99A1E; display: flex; align-items: center; justify-content: center; text-align: center"><div data-fit="2" style="width: 90px; font-weight: 700; font-size: {{badgeSize}}px; line-height: 1; color: #3A1A5C">{{badge}}</div></div>
</div></div>
<div data-fit="2" style="width: 500px; text-align: center; font-weight: 700; font-size: {{titleSize}}px; line-height: 1.04; color: #FFFFFF; text-shadow: -3px -3px 0 #3A1A5C, 3px -3px 0 #3A1A5C, -3px 3px 0 #3A1A5C, 3px 3px 0 #3A1A5C, 0 -4px 0 #3A1A5C, 0 4px 0 #3A1A5C, -4px 0 0 #3A1A5C, 4px 0 0 #3A1A5C, 0 9px 0 #3A1A5C; animation: popCycle 7s cubic-bezier(0.2, 0.8, 0.3, 1) both infinite">{{showTitle}}</div>
<div style="animation: riseCycle 7s cubic-bezier(0.2, 0.8, 0.3, 1) 0.2s both infinite"><div style="background: #FFF4E6; border: 4px solid #FFD34D; border-radius: 999px; padding: 4px 24px 6px; box-shadow: 0 5px 0 #3A1A5C; font-weight: 700; font-size: 28px; color: #A82868">{{when}}</div></div>
</div>
<div aria-hidden="true" style="position: absolute; left: 92px; top: 120px; animation: burstCycle 7s cubic-bezier(0.2, 0.8, 0.3, 1) 0.2s both infinite"><div style="width: 26px; height: 26px; background: #FFFFFF; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%); animation: twinkle 2.2s ease-in-out infinite"></div></div>
<div aria-hidden="true" style="position: absolute; left: 520px; top: 150px; animation: burstCycle 7s cubic-bezier(0.2, 0.8, 0.3, 1) 0.35s both infinite"><div style="width: 22px; height: 22px; background: #FFD34D; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%); animation: twinkle 2.6s ease-in-out -1s infinite"></div></div>
<div style="position: absolute; right: 68px; bottom: 52px"><dc-import name="OnceWordmark" size="24" hint-size="120px,43px"></dc-import></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none"><dc-import name="OncePage" dur="7" hint-size="640px,480px"></dc-import></div>
</div>
<sc-if value="{{crt}}" hint-placeholder-val="{{true}}">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 640px; height: 480px; z-index: 10; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(0,0,0,0.3) 0px, rgba(0,0,0,0.3) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px), repeating-linear-gradient(90deg, rgba(255,0,0,0.06) 0px, rgba(255,0,0,0.06) 1px, rgba(0,255,0,0.06) 1px, rgba(0,255,0,0.06) 2px, rgba(0,0,255,0.06) 2px, rgba(0,0,255,0.06) 3px), radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.5) 100%); box-shadow: inset 0 0 50px rgba(0,0,0,0.55)"></div>
</sc-if>
<sc-if value="{{safe}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; left: 32px; top: 24px; width: 576px; height: 432px; box-sizing: border-box; border: 2px dashed rgba(255,230,0,0.9); z-index: 11; pointer-events: none"></div>
<div aria-hidden="true" style="position: absolute; left: 64px; top: 48px; width: 512px; height: 384px; box-sizing: border-box; border: 2px dashed rgba(0,240,255,0.95); z-index: 11; pointer-events: none"></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showTitle": {"editor": "text", "default": "[SPECIAL TITLE]", "section": "Copy"}, "when": {"editor": "text", "default": "Saturday at [9:00]", "section": "Copy"}, "badge": {"editor": "text", "default": "All-new!", "section": "Copy"}, "theme": {"editor": "enum", "options": ["castle", "sparkle", "ocean", "garden", "twilight"], "default": "sparkle", "section": "Look"}, "crt": {"editor": "boolean", "default": true, "section": "Look"}, "safe": {"editor": "boolean", "default": false, "section": "Look"}, "$preview": {"width": 640, "height": 480}}'>
class Component extends DCLogic {
renderVals() {
const p = this.props;
const crt = p.crt ?? true;
const fit = (t, max, min, w, lines) => { const n = Math.max(4, String(t ?? '').length); return Math.max(min, Math.min(max, Math.floor((w * lines * 0.9) / (n * 0.56)))); };
const t = p.showTitle ?? '[SPECIAL TITLE]'; const badge = p.badge ?? 'All-new!';
return { showTitle: t, titleSize: fit(t, 68, 32, 500, 2), when: p.when ?? 'Saturday at [9:00]', badge, badgeSize: fit(badge, 28, 18, 90, 2), theme: p.theme ?? 'sparkle', crt, safe: p.safe ?? false, crtFilter: crt ? 'blur(0.6px) saturate(1.15) contrast(1.06)' : 'none' };
}
}
</script>
</body>
</html>
