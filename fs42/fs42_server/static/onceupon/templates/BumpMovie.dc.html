<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Once Upon movie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pacifico&display=swap">
<style>
body{margin:0}
@keyframes pageTurnCycle{0%{transform:scaleX(0.04) skewY(10deg);opacity:0}2%{opacity:1}8%{transform:scaleX(1.02) skewY(-1deg)}10%,88%{transform:scaleX(1) skewY(0deg);opacity:1}97%{transform:scaleX(0.04) skewY(-10deg);opacity:1}100%{transform:scaleX(0.04) skewY(-10deg);opacity:0}}
@keyframes pageShadeCycle{0%{opacity:0.95}9%,88%{opacity:0}97%,100%{opacity:0.95}}
@keyframes popCycle{0%,9%{transform:scale(0.4);opacity:0}15%{transform:scale(1.06);opacity:1}18%,100%{transform:scale(1);opacity:1}}
@keyframes ribbonCycle{0%,12%{transform:scaleX(0);opacity:0}18%{transform:scaleX(1.06);opacity:1}21%,100%{transform:scaleX(1);opacity:1}}
@keyframes riseCycle{0%,11%{transform:translateY(40px);opacity:0}18%,100%{transform:translateY(0);opacity:1}}
@keyframes floatCycle{0%,9%{transform:translateY(70px) rotate(-3deg);opacity:0}16%{transform:translateY(-6px) rotate(1deg);opacity:1}20%,100%{transform:translateY(0) rotate(0deg);opacity:1}}
@keyframes stampCycle{0%,14%{transform:scale(3) rotate(-20deg);opacity:0}20%{transform:scale(0.92) rotate(-8deg);opacity:1}23%,100%{transform:scale(1) rotate(-8deg);opacity:1}}
@keyframes burstCycle{0%,14%{transform:scale(0) rotate(0deg);opacity:0}20%{transform:scale(1.3) rotate(45deg);opacity:1}28%,100%{transform:scale(1) rotate(90deg);opacity:1}}
@keyframes twinkle{0%,100%{transform:scale(0.55) rotate(0deg);opacity:0.35}50%{transform:scale(1) rotate(20deg);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bubble{0%{transform:translateY(0);opacity:0}15%{opacity:0.85}100%{transform:translateY(-360px);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
</style>
</helmet>
<div style="width: 640px; height: 480px; position: relative; overflow: hidden; background: #1A0B30; filter: {{crtFilter}}; font-family: 'Fredoka', system-ui, sans-serif; color: #3A1A5C">
<div style="position: absolute; left: 0; top: 0; width: 640px; height: 480px; overflow: hidden; transform-origin: 0% 50%; animation: pageTurnCycle 7s cubic-bezier(0.45, 0, 0.25, 1) both infinite">
<div style="position: absolute; left: 0; top: 0"><dc-import name="OnceBG" theme="{{theme}}" hint-size="640px,480px"></dc-import></div>
<div style="position: absolute; left: 64px; top: 48px; width: 512px; height: 344px; display: flex; flex-direction: column; align-items: center; justify-content: center">
<div style="position: relative; z-index: 2; margin-bottom: -18px; animation: ribbonCycle 7s cubic-bezier(0.2, 0.8, 0.3, 1) both infinite">
<div aria-hidden="true" style="position: absolute; left: -26px; top: 12px; width: 56px; height: 40px; background: #C2468A; clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%, 24% 50%)"></div>
<div aria-hidden="true" style="position: absolute; right: -26px; top: 12px; width: 56px; height: 40px; background: #C2468A; clip-path: polygon(0% 0%, 100% 0%, 76% 50%, 100% 100%, 0% 100%)"></div>
<div style="position: relative; background: #FF8FC8; padding: 7px 32px 8px; box-shadow: 0 4px 0 #C2468A"><div data-fit="1" style="width: 250px; text-align: center; font-weight: 700; font-size: {{labelSize}}px; line-height: 1.15; color: #3A1A5C">{{label}}</div></div>
</div>
<div style="animation: popCycle 7s cubic-bezier(0.2, 0.8, 0.3, 1) both infinite"><div style="animation: bob 4s ease-in-out infinite"><div style="position: relative; width: 446px; height: 272px">
<div aria-hidden="true" style="position: absolute; left: 14px; top: 8px; width: 432px; height: 262px; border-radius: 6px 16px 16px 6px; background: repeating-linear-gradient(180deg, #FFF4E6 0px, #FFF4E6 4px, #E9D8C0 4px, #E9D8C0 6px); box-shadow: 0 10px 0 rgba(20,7,38,0.45)"></div>
<div style="position: absolute; left: 0; top: 0; width: 432px; height: 260px; box-sizing: border-box; border-radius: 6px 16px 16px 6px; background: #4B2380; border-left: 24px solid #311552; display: flex; align-items: center; justify-content: center">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 30px; height: 30px; background: #FFD34D; clip-path: polygon(0% 0%, 100% 0%, 0% 100%)"></div>
<div aria-hidden="true" style="position: absolute; right: 0; top: 0; width: 30px; height: 30px; border-radius: 0 16px 0 0; background: #FFD34D; clip-path: polygon(0% 0%, 100% 0%, 100% 100%)"></div>
<div aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 30px; height: 30px; background: #FFD34D; clip-path: polygon(0% 0%, 100% 100%, 0% 100%)"></div>
<div aria-hidden="true" style="position: absolute; right: 0; bottom: 0; width: 30px; height: 30px; border-radius: 0 0 16px 0; background: #FFD34D; clip-path: polygon(100% 0%, 100% 100%, 0% 100%)"></div>
<div style="width: 350px; height: 206px; box-sizing: border-box; border: 3px solid #FFD34D; border-radius: 12px; padding: 12px 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center">
<div aria-hidden="true" style="display: flex; gap: 10px; align-items: center">
<div style="width: 12px; height: 12px; background: #FFD34D; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%)"></div>
<div style="width: 18px; height: 18px; background: #FFD34D; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%); animation: twinkle 2s ease-in-out infinite"></div>
<div style="width: 12px; height: 12px; background: #FFD34D; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%)"></div>
</div>
<div data-fit="2" style="width: 300px; font-weight: 700; font-size: {{titleSize}}px; line-height: 1.05; color: #FFD34D; text-shadow: 0 3px 0 #2A1145">{{movieTitle}}</div>
<div style="font-weight: 600; font-size: 24px; color: #FF8FC8">{{when}}</div>
</div>
</div>
</div></div></div>
</div>
<div aria-hidden="true" style="position: absolute; left: 70px; top: 150px; animation: burstCycle 7s cubic-bezier(0.2, 0.8, 0.3, 1) both infinite"><div style="width: 30px; height: 30px; background: #FFFFFF; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%); animation: twinkle 2.2s ease-in-out infinite"></div></div>
<div aria-hidden="true" style="position: absolute; left: 548px; top: 92px; animation: burstCycle 7s cubic-bezier(0.2, 0.8, 0.3, 1) 0.2s both infinite"><div style="width: 24px; height: 24px; background: #FFD34D; clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%); animation: twinkle 2.6s ease-in-out -1s infinite"></div></div>
<div style="position: absolute; right: 68px; bottom: 52px"><dc-import name="OnceWordmark" size="24" hint-size="120px,43px"></dc-import></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none"><dc-import name="OncePage" dur="7" hint-size="640px,480px"></dc-import></div>
</div>
<sc-if value="{{crt}}" hint-placeholder-val="{{true}}">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 640px; height: 480px; z-index: 10; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(0,0,0,0.3) 0px, rgba(0,0,0,0.3) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px), repeating-linear-gradient(90deg, rgba(255,0,0,0.06) 0px, rgba(255,0,0,0.06) 1px, rgba(0,255,0,0.06) 1px, rgba(0,255,0,0.06) 2px, rgba(0,0,255,0.06) 2px, rgba(0,0,255,0.06) 3px), radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.5) 100%); box-shadow: inset 0 0 50px rgba(0,0,0,0.55)"></div>
</sc-if>
<sc-if value="{{safe}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; left: 32px; top: 24px; width: 576px; height: 432px; box-sizing: border-box; border: 2px dashed rgba(255,230,0,0.9); z-index: 11; pointer-events: none"></div>
<div aria-hidden="true" style="position: absolute; left: 64px; top: 48px; width: 512px; height: 384px; box-sizing: border-box; border: 2px dashed rgba(0,240,255,0.95); z-index: 11; pointer-events: none"></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"movieTitle": {"editor": "text", "default": "[MOVIE TITLE]", "section": "Copy"}, "when": {"editor": "text", "default": "Saturday at [10:00]", "section": "Copy"}, "label": {"editor": "text", "default": "Movie of the week", "section": "Copy"}, "theme": {"editor": "enum", "options": ["castle", "sparkle", "ocean", "garden", "twilight"], "default": "castle", "section": "Look"}, "crt": {"editor": "boolean", "default": true, "section": "Look"}, "safe": {"editor": "boolean", "default": false, "section": "Look"}, "$preview": {"width": 640, "height": 480}}'>
class Component extends DCLogic {
renderVals() {
const p = this.props;
const crt = p.crt ?? true;
const fit = (t, max, min, w, lines) => { const n = Math.max(4, String(t ?? '').length); return Math.max(min, Math.min(max, Math.floor((w * lines * 0.9) / (n * 0.56)))); };
const t = p.movieTitle ?? '[MOVIE TITLE]'; const label = p.label ?? 'Movie of the week';
return { movieTitle: t, titleSize: fit(t, 50, 26, 300, 2), when: p.when ?? 'Saturday at [10:00]', label, labelSize: fit(label, 28, 18, 250, 1), theme: p.theme ?? 'castle', crt, safe: p.safe ?? false, crtFilter: crt ? 'blur(0.6px) saturate(1.15) contrast(1.06)' : 'none' };
}
}
</script>
</body>
</html>
